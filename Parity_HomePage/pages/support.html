<!DOCTYPE html>
<html class="light scroll-smooth" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title data-dynamic-title="support">Support - Pairity</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "background": "#fbf9f5",
            "primary": "#091426",
            "secondary": "#8a4f39",
            "surface-container": "#efeeea",
            "on-surface": "#1b1c1a",
            "on-surface-variant": "#45474c"
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
    }
    .zen-card {
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .zen-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px -20px rgba(138, 79, 57, 0.1);
    }
  </style>
</head>
<body class="bg-background text-on-surface" data-page-type="subpage">
  <!-- Top Navigation -->
  <header class="bg-surface/80 backdrop-blur-md fixed top-0 w-full z-50 border-b border-outline-variant/10">
    <nav class="flex justify-between items-center max-w-[1200px] mx-auto w-full px-6 h-16">
      <div class="brand-logo-container flex items-center gap-xs cursor-pointer">
        <!-- Logo Injected dynamically -->
      </div>
      <div class="hidden md:flex items-center gap-8" id="desktop-nav">
        <!-- Nav links injected dynamically -->
      </div>
      <button id="menu-toggle" class="md:hidden material-symbols-outlined text-primary">menu</button>
    </nav>
    <!-- Mobile menu panel -->
    <div id="mobile-menu" class="hidden absolute top-16 left-0 w-full bg-background border-b border-outline-variant/20 p-safe-margin flex flex-col gap-sm md:hidden shadow-lg">
      <!-- Mobile links injected dynamically -->
    </div>
  </header>

  <main class="pt-32 max-w-[800px] mx-auto px-6 text-center" id="support-page-container">
    <!-- Content Injected Dynamically -->
  </main>

  <!-- Footer -->
  <footer class="bg-surface dark:bg-surface w-full py-xl border-t border-outline-variant/20 mt-xl">
    <div class="max-w-[600px] mx-auto px-safe-margin text-center" id="footer-section">
      <!-- Injected dynamically -->
    </div>
  </footer>

  <!-- Scripts -->
  <script src="../site.config.js"></script>
  <script src="../assets/js/site.js"></script>
</body>
</html>
